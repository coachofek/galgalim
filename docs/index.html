<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>גלגלים על גלגלים</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1419">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גלגלים">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1419;--panel:#161c24;--panel-2:#1d252f;--line:#2a3441;--txt:#e8edf3;--muted:#8b98a8;
 --free:#22c55e;--busy:#f59e0b;--off:#5b6773;--accent:#3b82f6;--gold:#eab308;--violet:#8b5cf6;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0d11;color:var(--txt);font-family:"Segoe UI",system-ui,Arial,sans-serif;
 display:grid;place-items:center;min-height:100vh}
#phone{width:390px;height:800px;max-height:100vh;background:var(--bg);position:relative;overflow:hidden;
 border-radius:32px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column}
@media(max-width:430px),(max-height:820px){#phone{width:100vw;height:100vh;border-radius:0;border:0}}
.scr{flex:1;display:none;flex-direction:column;overflow:hidden}.scr.on{display:flex}
.body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;
 background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.topbar .who{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .av{width:38px;height:38px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);
 display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.topbar .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sb{font-size:11px;color:var(--muted)}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);width:34px;height:34px;
 border-radius:9px;cursor:pointer;font-size:14px;flex:none}
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 11px;font-family:inherit;
 font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button .ic{font-size:18px}.nav button.on{color:var(--accent)}
.nav button .bdg{position:absolute;top:4px;inset-inline-end:22%;background:var(--red);color:#fff;
 border-radius:999px;font-size:9px;padding:0 5px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.mut{color:var(--muted)}.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.money{color:var(--free);font-weight:700;font-variant-numeric:tabular-nums}.center{text-align:center}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer;
 font-family:inherit;margin-top:8px}
.btn.p{background:var(--accent);color:#fff}.btn.ok{background:var(--free);color:#04240f}
.btn.g{background:var(--gold);color:#241f00}.btn.v{background:var(--violet);color:#fff}
.btn.no{background:var(--red);color:#fff}
.btn.d{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.4)}
.btn.s{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.5}.btn.sm{padding:9px;font-size:12.5px;border-radius:9px;margin-top:0}
.rowbtns{display:flex;gap:8px;margin-top:10px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
 padding:12px;color:var(--txt);font-size:15px;font-family:inherit}
textarea{min-height:74px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.fld{margin-bottom:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{font-size:11px;padding:3px 10px;border-radius:999px;display:inline-block}
.badge.free{background:rgba(34,197,94,.15);color:var(--free)}
.badge.busy{background:rgba(245,158,11,.15);color:var(--busy)}
.badge.off{background:rgba(91,103,115,.2);color:var(--off)}
.badge.pend{background:rgba(234,179,8,.16);color:var(--gold)}
/* התחברות */
#auth .body{display:flex;flex-direction:column;justify-content:center;padding:26px}
.logo{width:74px;height:74px;border-radius:20px;margin:0 auto 16px;
 background:linear-gradient(135deg,#3b82f6,#22c55e);display:grid;place-items:center;font-size:38px}
#auth h1{text-align:center;font-size:21px;margin:0 0 5px}
#auth .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:10px;
 padding:11px;font-size:12.5px;margin-bottom:12px;display:none;line-height:1.6}
.err.on{display:block}
.link{text-align:center;margin-top:14px;font-size:13px;color:var(--accent);cursor:pointer}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px;border-radius:8px;
 font-size:13px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
/* נהג */
.statusbox{text-align:center;padding:20px 14px}
.statusbox .lamp{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:32px}
.lamp.free{background:rgba(34,197,94,.14);border:2px solid var(--free)}
.lamp.busy{background:rgba(245,158,11,.14);border:2px solid var(--busy)}
.lamp.off{background:rgba(91,103,115,.16);border:2px solid var(--off)}
.statusbox .st{font-size:18px;font-weight:700}
.statusbox .ex{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.offer{background:linear-gradient(160deg,#2a2410,#161c24);border:2px solid var(--gold);border-radius:16px;
 padding:15px;margin-bottom:12px}
.offer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.offer .kind{font-size:11.5px;font-weight:700;color:var(--gold)}
.offer .cd{font-size:12px;font-weight:700;color:var(--gold)}
.leg{display:flex;gap:9px;margin-bottom:8px}
.leg .pin{font-size:14px;flex:none;width:18px;text-align:center}
.leg .txt{font-size:13.5px;line-height:1.45}.leg .lb{font-size:10.5px;color:var(--muted);display:block}
.offer .amt{text-align:center;font-size:23px;font-weight:700;color:var(--free);margin:12px 0 4px}
.offer .pay{text-align:center;font-size:11.5px;color:var(--muted)}
.msg{background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--accent);
 border-radius:12px;padding:12px;margin-bottom:9px}
.msg.bid{border-inline-start-color:var(--gold)}.msg.sent{border-inline-start-color:var(--free)}
.msg.rl{border-inline-start-color:var(--red);background:rgba(239,68,68,.05)}
.msg .mt{font-size:10.5px;color:var(--muted);margin-bottom:5px}.msg .mb{font-size:13.5px;line-height:1.6}
/* מנהל */
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--c)}
.stat .n{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
#map-slot{margin-bottom:11px}
#mmap{position:relative;height:300px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
 background:#0c1218;z-index:1}
#mmap.fs{position:fixed;inset:0;height:auto;border-radius:0;border:0;z-index:100}
#fs-exit{position:fixed;top:12px;inset-inline-start:12px;z-index:101;display:none;background:var(--panel);
 border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font-size:13px;
 font-weight:700;font-family:inherit;cursor:pointer}
#fs-exit.on{display:block}
.pin2{display:flex;align-items:center;gap:4px;white-space:nowrap;transform:translate(-7px,-7px)}
.pin2 .pd{width:13px;height:13px;border-radius:50%;border:2px solid #0c1218;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.pin2.free .pd{background:#22c55e}.pin2.busy .pd{background:#f59e0b}.pin2.off .pd{background:#5b6773}
.pin2 .pl{background:rgba(12,18,24,.82);color:#e8edf3;font-size:10px;padding:1px 5px;border-radius:5px;
 border:1px solid rgba(255,255,255,.14)}
.leaflet-container{background:#0c1218;font-family:inherit}
.leaflet-control-attribution{font-size:8px;background:rgba(12,18,24,.7)!important;color:#7d8b9c!important}
.tripmark{background:rgba(12,18,24,.85);border:1px solid rgba(255,255,255,.2);border-radius:5px;
 font-size:10px;padding:1px 5px;color:#e8edf3;white-space:nowrap}
.mapbar{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.mapbar button,.chips button{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
 white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:12px;font-family:inherit;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px}.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.drow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;padding:10px 12px;margin-bottom:8px}
.drow .av{width:36px;height:36px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);
 display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.drow .i{flex:1;min-width:0}
.drow .n1{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.code{font-size:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
 border-radius:5px;padding:1px 5px}
.drow .n2,.drow .n3{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .n3{color:#9fb0c4}
.ent{background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--violet);
 border-radius:12px;padding:12px;margin-bottom:9px}
.ent.pend{border-inline-start-color:var(--gold);background:rgba(234,179,8,.05)}
.ent.rel{border-inline-start-color:var(--red)}
.ent .tm{font-size:14px;font-weight:700;color:var(--violet)}
.ent .ti{font-size:13.5px;font-weight:600;margin-top:3px}
.ent .nt{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.ent .ea{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ent .ea button{flex:1;min-width:76px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
 border-radius:8px;padding:7px 4px;font-size:11.5px;font-family:inherit;cursor:pointer}
.ent .ea button.ok{border-color:rgba(34,197,94,.45);color:var(--free)}
.ent .ea button.mv{border-color:rgba(234,179,8,.45);color:var(--gold)}
.priv{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);border-radius:10px;
 padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:11px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calnav .m{font-size:14px;font-weight:700}
.calnav button{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);width:32px;height:32px;
 border-radius:9px;font-size:15px;font-family:inherit;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
.cgrid .dw{text-align:center;font-size:10px;color:var(--muted);padding:3px 0}
.cd{aspect-ratio:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:pointer}
.cd.out{opacity:.25}.cd.today{border-color:var(--accent)}.cd.sel{background:#2a2145;border-color:var(--violet)}
.cd .pips{display:flex;gap:2px}.cd .pip{width:4px;height:4px;border-radius:50%;background:var(--violet)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;color:var(--muted);font-size:10.5px;font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line)}
.sumrow td{background:var(--panel-2);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
 padding:10px 4px;font-size:12.5px;font-family:inherit;cursor:pointer}
.tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;
 max-height:92%;display:flex;flex-direction:column}
.sheet h3{margin:0;padding:15px;border-bottom:1px solid var(--line);font-size:15px;
 display:flex;justify-content:space-between;align-items:center}
.sheet .sb2{padding:15px;overflow-y:auto}
.sheet .sf{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .sf .btn{margin-top:0}
.x{background:none;border:0;color:var(--muted);font-size:21px;cursor:pointer;padding:0 4px}
#toast{position:absolute;bottom:78px;inset-inline:14px;background:var(--free);color:#04240f;padding:12px 15px;
 border-radius:11px;font-size:13px;font-weight:600;text-align:center;z-index:60;transform:translateY(160px);
 transition:transform .3s;line-height:1.5}
#toast.on{transform:translateY(0)}
#splash{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:200}
.pinbox{background:var(--panel-2);border:2px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;margin-top:12px}
.pinbox .p{font-size:30px;font-weight:800;letter-spacing:5px;color:var(--gold);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="phone">

  <!-- ===== התחברות ===== -->
  <div class="scr on" id="scr-auth">
    <div class="body" id="auth">
      <div class="logo">🚚</div>
      <h1>גלגלים על גלגלים</h1>
      <div class="sub" id="au-sub">התחברות למערכת</div>
      <div class="err" id="au-err"></div>
      <div class="seg">
        <button class="on" id="sg-in" onclick="authMode('in')">התחברות</button>
        <button id="sg-up" onclick="authMode('up')">הרשמה</button>
      </div>
      <div class="fld"><label>אימייל</label><input id="au-email" type="email" autocomplete="username" placeholder="name@example.com"></div>
      <div class="fld"><label>סיסמה</label><input id="au-pass" type="password" autocomplete="current-password" placeholder="לפחות 6 תווים"></div>
      <div id="up-only" style="display:none">
        <div class="fld"><label>מי אתה?</label><select id="au-role">
          <option value="driver">נהג — יש לי קוד חיבור מהמנהל</option>
          <option value="owner">בעל צי — אני מנהל את הנהגים</option>
        </select></div>
      </div>
      <button class="btn p" id="au-go" onclick="doAuth()">התחבר</button>
    </div>
  </div>

  <!-- ===== חיבור נהג בקוד ===== -->
  <div class="scr" id="scr-claim">
    <div class="body" style="display:flex;flex-direction:column;justify-content:center;padding:26px">
      <div class="logo">🔑</div>
      <h1 style="text-align:center;font-size:20px;margin:0 0 6px">חיבור לצי</h1>
      <div class="sub" style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px">
        הזן את קוד החיבור בן 6 הספרות שקיבלת מהמנהל</div>
      <div class="err" id="cl-err"></div>
      <div class="fld"><input id="cl-pin" inputmode="numeric" maxlength="6" placeholder="000000"
        style="text-align:center;font-size:26px;letter-spacing:8px;font-weight:700"></div>
      <button class="btn p" onclick="doClaim()">חבר אותי</button>
      <button class="btn s" onclick="signOut()">התנתק</button>
    </div>
  </div>

  <!-- ===== יצירת צי ===== -->
  <div class="scr" id="scr-fleet">
    <div class="body" style="display:flex;flex-direction:column;justify-content:center;padding:26px">
      <div class="logo">🚕</div>
      <h1 style="text-align:center;font-size:20px;margin:0 0 6px">הקמת הצי שלך</h1>
      <div class="sub" style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px">
        פעם אחת בלבד. אחר כך תוסיף נהגים.</div>
      <div class="err" id="fl-err"></div>
      <div class="fld"><label>שם הצי</label><input id="fl-name" placeholder="לדוגמה: מוניות ירושלים"></div>
      <button class="btn p" onclick="doCreateFleet()">צור צי</button>
      <button class="btn s" onclick="signOut()">התנתק</button>
    </div>
  </div>

  <!-- ===== נהג ===== -->
  <div class="scr" id="scr-driver">
    <div class="topbar">
      <div class="who"><div class="av" id="dv-av"></div>
        <div><div class="nm" id="dv-name"></div><div class="sb" id="dv-sub"></div></div></div>
      <button class="iconbtn" onclick="signOut()">⏻</button>
    </div>
    <div class="body" id="dv-body"></div>
    <div class="nav" id="dv-nav">
      <button class="on" data-p="home" onclick="dvTab('home')"><span class="ic">🏠</span>ראשי
        <span class="bdg" id="dv-b-home" style="display:none"></span></button>
      <button data-p="trips" onclick="dvTab('trips')"><span class="ic">🧾</span>הנסיעות שלי</button>
      <button data-p="msgs" onclick="dvTab('msgs')"><span class="ic">✉️</span>הודעות
        <span class="bdg" id="dv-b-msgs" style="display:none"></span></button>
    </div>
  </div>

  <!-- ===== בעלים ===== -->
  <div class="scr" id="scr-owner">
    <div class="topbar">
      <div class="who">
        <div class="av" style="background:linear-gradient(135deg,#3b82f6,#22c55e);border:0">👑</div>
        <div><div class="nm" id="ow-name">מרכז שליטה</div><div class="sb" id="ow-sub"></div></div></div>
      <button class="iconbtn" onclick="openBroadcast()">📣</button>
      <button class="iconbtn" onclick="signOut()">⏻</button>
    </div>
    <div class="body" id="ow-body"></div>
    <div class="nav" id="ow-nav">
      <button class="on" data-p="map" onclick="owTab('map')"><span class="ic">🗺</span>מפה
        <span class="bdg" id="ow-b-map" style="display:none"></span></button>
      <button data-p="drivers" onclick="owTab('drivers')"><span class="ic">👥</span>נהגים</button>
      <button data-p="today" onclick="owTab('today')"><span class="ic">📋</span>היום
        <span class="bdg" id="ow-b-today" style="display:none"></span></button>
      <button data-p="cal" onclick="owTab('cal')"><span class="ic">📅</span>יומן
        <span class="bdg" id="ow-b-cal" style="display:none"></span></button>
      <button data-p="feed" onclick="owTab('feed')"><span class="ic">🔔</span>הודעות</button>
    </div>
  </div>

  <div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
    <div class="inner"><h3><span id="sh-title"></span><button class="x" onclick="closeSheet()">✕</button></h3>
      <div class="sb2" id="sh-body"></div><div class="sf" id="sh-foot"></div></div>
  </div>

  <div id="toast"></div>

async function loadAll(){
  if(!me)return;
  const q=[
    db.from("drivers").select("*").order("name"),
    db.from("trips").select("*").order("created_at",{ascending:false}).limit(300),
    db.from("offers").select("*").eq("status","pending"),
    db.from("releases").select("*").order("created_at",{ascending:false}).limit(50),
    db.from("messages").select("*").order("sent_at",{ascending:false}).limit(120),
  ];
  if(me.role==="owner"){
    q.push(db.from("journal_entries").select("*"));
    q.push(db.from("personal_trips").select("*"));
    q.push(db.from("offer_declines").select("*"));
  }
  const r=await Promise.all(q);
  D.drivers=r[0].data||[];D.trips=r[1].data||[];D.offers=r[2].data||[];
  D.releases=r[3].data||[];D.messages=r[4].data||[];
  if(me.role==="owner"){D.journal=r[5].data||[];D.personal=r[6].data||[];D.declines=r[7].data||[]}
  if(me.role==="driver"&&D.drivers.length)me.driver=D.drivers[0];
}

let pushToken=null,pushP=null;
function setupPush(){
  if(!NATIVE)return Promise.resolve();
  return pushP||(pushP=initPush().catch(()=>{}));
}
async function initPush(){
  await PN.createChannel({id:"alerts",name:"נסיעות והודעות",importance:5,visibility:1,vibration:true}).catch(()=>{});
  PN.addListener("registration",async t=>{
    pushToken=t.value;
    await rpc("register_push_token",{p_token:t.value,p_platform:"android"}).catch(()=>{});
  });
  // כשהאפליקציה פתוחה המערכת לא מציגה את ההתראה — מציגים בעצמנו ומרעידים
  PN.addListener("pushNotificationReceived",n=>{
    toast((n.title||"")+(n.body?" — "+n.body:""),"#eab308","#2a2000");
    try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  });
  PN.addListener("pushNotificationActionPerformed",()=>{
    me&&(me.role==="owner"?owTab("map"):dvTab("home"));
  });
  let perm=await PN.checkPermissions();
  if(perm.receive!=="granted")perm=await PN.requestPermissions();
  if(perm.receive==="granted")await PN.register();
  else toast("בלי אישור התראות לא תדע כשמגיעה נסיעה — אפשר לאשר בהגדרות הטלפון","#f59e0b","#3a2500");
}

// ברקע אנדרואיד מאט בקשות מהדפדפן הפנימי — לכן המיקום נשלח דרך ערוץ נייטיבי
async function sendLocNative(lat,lng){
  const{data:{session}}=await db.auth.getSession();
  if(!session||!me||me.role!=="driver")return;
  await Capacitor.Plugins.CapacitorHttp.request({method:"PATCH",
    url:`${SUPABASE_URL}/rest/v1/drivers?id=eq.${me.driver.id}`,
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token,
      "Content-Type":"application/json",Prefer:"return=minimal"},
    data:{lat,lng,last_seen:new Date().toISOString()}}).catch(()=>{});
}

async function startGps(){
  if(NATIVE){
    if(bgWatcher)return;
    await setupPush();   // קודם אישור התראות, אחר כך מיקום — לא שני חלונות בבת אחת
    bgWatcher=await BG.addWatcher({
      backgroundTitle:"גלגלים על גלגלים — מחובר",
      backgroundMessage:"המיקום שלך נשלח למנהל",
      requestPermissions:true,stale:false,distanceFilter:25
    },(loc,e)=>{
      if(e){
        if(e.code==="NOT_AUTHORIZED"&&confirm("בלי גישה למיקום המנהל לא יראה אותך במפה.\nלפתוח הגדרות ולאשר?"))BG.openSettings();
        return;
      }
      if(loc)sendLocNative(loc.latitude,loc.longitude);
    });
    return;
  }
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(async p=>{
    if(!me||me.role!=="driver")return;
    await db.from("drivers").update({lat:p.coords.latitude,lng:p.coords.longitude,
      last_seen:new Date().toISOString()}).eq("id",me.driver.id);
  },e=>{if(e.code===1)toast("כדי שהמנהל יראה אותך במפה — אשר גישה למיקום","#f59e0b","#3a2500")},
  {enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* ==================== מפה ==================== */
let mapHost=null,lmap=null,pinLayer=null,routeLayer=null,mapFs=false;
const hasL=()=>typeof L!=="undefined"&&L.map;
function ensureHost(){if(!mapHost){mapHost=document.createElement("div");mapHost.id="mmap"}return mapHost}
function initMap(){if(!hasL()||lmap)return;
  lmap=L.map(mapHost,{zoomControl:true}).setView([31.782,35.216],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(lmap);
  pinLayer=L.layerGroup().addTo(lmap);routeLayer=L.layerGroup().addTo(lmap)}
function paintMap(){
  const host=ensureHost();if(!hasL()){host.innerHTML='<div class="empty">המפה דורשת חיבור לאינטרנט</div>';return}
  initMap();pinLayer.clearLayers();routeLayer.clearLayers();
  D.drivers.forEach(d=>{
    if(d.lat==null||d.lng==null)return;
    L.marker([d.lat,d.lng],{icon:L.divIcon({className:"",iconSize:null,
      html:`<div class="pin2 ${d.status}"><span class="pd"></span><span class="pl">${esc(d.name)} · ${d.code}</span></div>`})})
      .addTo(pinLayer).on("click",()=>openDriverCard(d.id));
    const t=D.trips.find(x=>x.status==="active"&&x.driver_id===d.id);
    if(t&&t.to_lat){
      const pts=[[d.lat,d.lng]];
      if(t.from_lat&&!t.picked_up_at)pts.push([t.from_lat,t.from_lng]);
      pts.push([t.to_lat,t.to_lng]);
      L.polyline(pts,{color:"#f59e0b",weight:3,opacity:.85,dashArray:"6 5"}).addTo(routeLayer);
      L.marker([t.to_lat,t.to_lng],{icon:L.divIcon({className:"",iconSize:null,
        html:`<div class="tripmark">🔴 ${esc(t.to_text)}</div>`})}).addTo(routeLayer);
    }
  });
}
function focusMap(w){if(!lmap)return;
  if(w==="jlm")lmap.setView([31.782,35.216],12);
  if(w==="country")lmap.fitBounds([[29.5,34.25],[33.3,35.9]],{padding:[10,10]});
  if(w==="all"){const b=D.drivers.filter(d=>d.lat!=null).map(d=>[d.lat,d.lng]);
    if(b.length)lmap.fitBounds(L.latLngBounds(b).pad(.15));else toast("אין עדיין נהגים עם מיקום","#f59e0b","#3a2500")}}
function toggleFs(){mapFs=!mapFs;ensureHost().classList.toggle("fs",mapFs);
  $("fs-exit").classList.toggle("on",mapFs);if(lmap)setTimeout(()=>lmap.invalidateSize(),60)}

const dayEntries=k=>D.journal.filter(e=>e.entry_date===k).sort((a,b)=>a.entry_time.localeCompare(b.entry_time));
function renderCal(){
  const b=$("ow-body");
  b.innerHTML=`<div class="priv">🔒 יומן פרטי — רק אתה רואה אותו. הנהגים לא רואים ממנו דבר.</div>

      <button class="${calTab==="cal"?"on":""}" onclick="calTab='cal';renderCal()">🗓 לוח שנה</button>
      <button class="${calTab==="hist"?"on":""}" onclick="calTab='hist';renderCal()">📗 ההיסטוריה שלי</button>
    </div><div id="cal-pane">${calTab==="cal"?calHtml():histHtml()}</div>`;
}
function calHtml(){
  const y=calCur.getFullYear(),m=calCur.getMonth(),today=ymd(new Date());
  const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let g=["א","ב","ג","ד","ה","ו","ש"].map(d=>`<div class="dw">${d}</div>`).join("");
  for(let i=0;i<start;i++)g+=`<div class="cd out"></div>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,es=dayEntries(k);
    g+=`<div class="cd${k===today?" today":""}${k===calSel?" sel":""}" onclick="calSel='${k}';renderCal()">
      <span>${d}</span><span class="pips">${es.slice(0,4).map(()=>`<i class="pip"></i>`).join("")}</span></div>`;
  }
  const es=dayEntries(calSel);
  const list=es.length?es.map(e=>{const pend=e.status==="pending";
    return`<div class="ent${pend?" pend":""}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="tm">${e.entry_time.slice(0,5)}</span>
        ${pend?`<span class="badge pend">⏳ ממתין לאישור</span>`:""}</div>
      <div class="ti">${esc(e.title)}</div>
      ${e.private_note?`<div class="nt">📝 ${esc(e.private_note)}</div>`:""}
      <div class="ea">${pend?`<button onclick="calCancel('${e.id}')">בטל העברה</button>`
        :`<button class="ok" onclick="calDone('${e.id}')">✅ בוצעה</button>
          <button class="mv" onclick="calMove('${e.id}')">↗ העבר</button>
          <button onclick="calEdit('${e.id}')">ערוך</button>
          <button onclick="calDel('${e.id}')">מחק</button>`}</div></div>`}).join("")
    :`<div class="empty" style="padding:22px">אין נסיעות ביום זה</div>`;
  return`<div class="calnav"><button onclick="calShift(1)">›</button>
      <span class="m">${calCur.toLocaleDateString("he-IL",{month:"long",year:"numeric"})}</span>
      <button onclick="calShift(-1)">‹</button></div>
    <div class="cgrid">${g}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
      <b style="font-size:13px">${new Date(calSel+"T12:00").toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}</b>
      <button class="btn p sm" style="width:auto;padding:7px 13px" onclick="calEdit()">➕ נסיעה</button></div>${list}`;
}

        <td>${m[k].n}</td><td class="money">${ils(m[k].s)}</td></tr>`}).join("")}</tbody></table></div>
    <div class="card"><h4>כל הנסיעות</h4><table><thead><tr><th>תאריך</th><th>הנסיעה</th><th>גבייה</th></tr></thead><tbody>
      ${s.map(t=>`<tr><td>${t.entry_date}<br><span class="mut" style="font-size:10px">${t.entry_time.slice(0,5)}</span></td>
        <td style="font-size:11.5px">${esc(t.title)}${t.summary?`<br><span class="mut">${esc(t.summary)}</span>`:""}</td>
        <td class="money">${ils(t.amount)}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="sumrow"><td colspan="2">סה״כ ${s.length}</td><td class="money">${ils(tot)}</td></tr></tfoot></table></div>`;
}

/* ==================== הפעלה ==================== */
authMode("in");
db.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){me=null;showScreen("auth")}});
boot();
setInterval(()=>{if(me)render()},30000);   // רענון תצוגת הזמנים
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
